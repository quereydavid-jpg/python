<h1>Editar producto</h1>
<form method="post">
    {% csrf_token %}
    <label>Código de barra</label>
    <input type="text" name="codigo_barra" value="{{ producto.codigo_barra }}"><br>

    <label>Descripción</label>
    <input type="text" name="descripcion" value="{{ producto.descripcion }}"><br>

    <label>Precio costo</label>
    <input type="number" step="0.01" name="precio_costo" value="{{ producto.precio_costo }}"><br>

    <label>Precio venta</label>
    <input type="number" step="0.01" name="precio_venta" value="{{ producto.precio_venta }}"><br>

    <label>IVA</label>
    <select name="iva">
        <option value="EXENTO" {% if producto.iva == "EXENTO" %}selected{% endif %}>Exento</option>
        <option value="5" {% if producto.iva == "5" %}selected{% endif %}>5%</option>
        <option value="10" {% if producto.iva == "10" %}selected{% endif %}>10%</option>
    </select><br>

    <label>Stock</label>
    <input type="number" name="stock" value="{{ producto.stock }}"><br>

    <label>Unidad de medida</label>
    <input type="text" name="unidad_medida" value="{{ producto.unidad_medida }}"><br>

    <button type="submit">Guardar cambios</button>
</form>
